<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全文字漢字化ジェネレーター</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>全文字漢字化ジェネレーター</h1>
    <p>入力された文章のひらがな・カタカナを、無理やり漢字に変換します。</p>
    
    <div class="input-area">
      <textarea id="inputText" placeholder="ここに文章を入力してください..."></textarea>
    </div>
    
    <button id="convertBtn" disabled>辞書読み込み中...</button>
    
    <div class="output-area">
      <textarea id="outputText" readonly placeholder="変換結果がここに表示されます"></textarea>
    </div>
  </div>

  <!-- ロジックの読み込み -->
  <script src="converter.js"></script>
  <!-- DOM操作の読み込み -->
  <script src="main.js"></script>
</body>
</html>
